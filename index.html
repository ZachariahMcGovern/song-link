<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Paste a Spotify song link and get it on Apple Music, SoundCloud, Amazon Music and more.">

  <!-- Home-screen app settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Song Link">
  <meta name="theme-color" content="#0d1117">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-180.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">

  <title>Song Link Converter</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>🎵 Song Link Converter</h1>
      <p class="sub">Paste a Spotify song link and get it on every other platform.</p>
    </header>

    <!-- Input -->
    <div class="input-row">
      <input type="text" id="url" placeholder="https://open.spotify.com/track/..." autocomplete="off" spellcheck="false" aria-label="Spotify song link">
      <button class="go" id="go" type="button">Find</button>
    </div>
    <button class="paste" id="paste" type="button">📋 Paste from clipboard &amp; find</button>

    <!-- Status message and results (filled in by js/app.js) -->
    <p id="status" class="status" hidden></p>
    <section id="result" aria-live="polite"></section>

    <footer>
      Song info from Spotify, matches from Apple Music search.<br>
      "Exact" links go straight to the song. "Search" links open that app's search for it.<br>
      <a href="https://github.com/ZachariahMcGovern/song-link" target="_blank" rel="noopener">View on GitHub</a>
    </footer>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
